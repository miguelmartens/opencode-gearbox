name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    # Publish from main only, also when started by hand.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.x'
      - run: bun install --frozen-lockfile
      - run: bun test
      # bun publish cannot use npm trusted publishing (OIDC) or provenance. It needs an npm
      # automation token stored as the repository secret NPM_TOKEN. A version that is already
      # on npm is skipped, so re-running the job is safe.
      - run: bun publish --tolerate-republish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
