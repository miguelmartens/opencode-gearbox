name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    # Publish from main only, also when started by hand.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC): no stored token, and npm adds provenance. npm sets a trusted
      # publisher only on a package that exists, so publish the first version by hand, then add
      # this repository and workflow as the trusted publisher on npmjs.com.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test
      # Node only provides the npm CLI: bun publish cannot use trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Check whether this version is already on npm
        id: check
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; the publish step will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.published == 'false'
        run: npm publish
