name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/brand/**', 'bench/results/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy brand assets into the site
        run: |
          cp assets/brand/social-preview.png assets/brand/favicon.svg site/
          # Benchmark results: the site's Benchmark section stays hidden without this file.
          if [ -f bench/results/summary.json ]; then cp bench/results/summary.json site/bench.json; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
